name: INVORA CI

on:
  push:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # Backend
    - name: Install backend dependencies
      run: |
        cd backend
        npm install

    - name: Check backend
      run: |
        cd backend
        npm run build || echo "No build step"

    # Frontend
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm install

    - name: Build frontend
      run: |
        cd Frontend
        npm run build